[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "aark"
version = "0.1.0"
description = "airallergy's research kit"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Cheng Cui", email = "cheng.cui.95@gmail.com" }]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["eppy~=0.5.63", "numpy~=2.4", "pyodbc~=5.3"]

[project.urls]
repository = "https://github.com/airallergy/aark"

[dependency-groups]
dev = ["mypy==2.3.*", "pytest~=9.1", "pytest-cov~=7.1", "ruff==0.16.*"]

[tool.uv]
required-version = "==0.12.*"

[tool.ruff]
target-version = "py314" # needed by the nested .ruff.toml

[tool.ruff.format]
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "E",
    "F",
    "FLY",
    "FURB",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "SLOT",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "YTT",
]
ignore = [
    "E266",
    "E501",
    "E741",
    "PLR0912",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLW0603",
    "RET505",
    "RUF023",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["aark", "tests"]
namespace_packages = false
ignore_missing_imports = true
strict = true
enable_incomplete_feature = ["PreciseTupleTypes"]

[tool.pytest.ini_options]
addopts = "--cov=aark"
testpaths = ["tests"]
